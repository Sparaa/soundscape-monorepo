# Soundscape monorepo — self-hosted dynamic radio. Everything builds from this repo, on Linux or on
# Windows (Docker Desktop + WSL2):
#     docker compose --profile gpu --profile llm up -d --build
# Profiles:
#   gpu  the YuE2 (composer) and SheetSage2 (transcriber + CLAP) sidecars — need an NVIDIA GPU
#   llm  a bundled Ollama that writes titles / lyrics (the api talks to it at http://ollama:11434/v1)
# Without a profile, point YUE2_URL / SHEETSAGE_URL / LLM_BASE_URL in .env at services you already run.
services:
  web:
    build: ./web
    container_name: soundscape-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3021}
    ports: ["127.0.0.1:${WEB_PORT:-3020}:3000"]
    depends_on: [api]
  api:
    build: ./api
    container_name: soundscape-api
    restart: unless-stopped
    environment:
      YUE2_URL: ${YUE2_URL:-http://yue2:3015}
      SHEETSAGE_URL: ${SHEETSAGE_URL:-http://sheetsage:3016}
      CLIPGRAB_URL: ${CLIPGRAB_URL:-http://clipgrab:3014}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-local}
      LIBRARY_DIR: /library
    volumes: ["${LIBRARY_DIR:-./library}:/library"]
    ports: ["127.0.0.1:${API_PORT:-3021}:3021"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}   # enough history to diagnose a radio stall
  yue2:
    profiles: ["gpu"]
    build: ./sidecars/yue2-sidecar
    image: yue2-sidecar:latest
    container_name: soundscape-yue2
    restart: unless-stopped
    environment: {SCRATCH_DIR: /scratch, HF_HOME: /data/hf-cache, MUSIC_MODEL: m-a-p/YuE2-3B, MUSIC_VAE: m-a-p/YuE2-Vae, MUSIC_LOCAL_FILES_ONLY: "0", MUSIC_BUDGET_GIB: "${MUSIC_BUDGET_GIB:-20}", MUSIC_IDLE_UNLOAD_MIN: "10", NVIDIA_VISIBLE_DEVICES: "${SOUNDSCAPE_GPU_UUID:-all}", NVIDIA_DRIVER_CAPABILITIES: compute,utility}
    volumes: ["yue2-hf-cache:/data/hf-cache"]
    tmpfs: ["/scratch:size=2g"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
  sheetsage:
    profiles: ["gpu"]
    build: ./sidecars/sheetsage-sidecar
    image: sheetsage-sidecar:latest
    container_name: soundscape-sheetsage
    restart: unless-stopped
    environment: {SCRATCH_DIR: /scratch, HF_HOME: /data/hf-cache, SHEETSAGE_MODEL: m-a-p/SheetSage2, SHEETSAGE_LOCAL_FILES_ONLY: "0", SHEETSAGE_DTYPE: bf16, SHEETSAGE_IDLE_UNLOAD_MIN: "10", NVIDIA_VISIBLE_DEVICES: "${SOUNDSCAPE_GPU_UUID:-all}", NVIDIA_DRIVER_CAPABILITIES: compute,utility}
    volumes: ["sheetsage-hf-cache:/data/hf-cache"]
    tmpfs: ["/scratch:size=1g"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
  clipgrab:
    build: ./sidecars/clipgrab-sidecar
    image: clipgrab-sidecar:latest
    container_name: soundscape-clipgrab
    restart: unless-stopped
    tmpfs: ["/scratch:size=2g"]
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    container_name: soundscape-ollama
    restart: unless-stopped
    # KEEP_ALIVE=0 unloads the writer right after each call so YuE2 gets the whole GPU (matters on 16 GB cards).
    # Pull the model once: docker compose exec ollama ollama pull qwen2.5:7b-instruct
    environment: {OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-0}", OLLAMA_CONTEXT_LENGTH: "8192", NVIDIA_VISIBLE_DEVICES: "${SOUNDSCAPE_GPU_UUID:-all}", NVIDIA_DRIVER_CAPABILITIES: compute,utility}
    volumes: ["ollama-models:/root/.ollama"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
volumes:
  yue2-hf-cache: {}
  sheetsage-hf-cache: {}
  ollama-models: {}
